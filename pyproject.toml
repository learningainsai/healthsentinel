[project]
name = "healthsentinel"
version = "0.1.0"
description = "Health Sentinel — guardrailed multi-agent health/nutrition assistant (LangGraph + RAG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.3.2",
    "langchain-chroma>=0.2.6",
    "langchain-text-splitters>=0.3,<0.4",
    "chromadb>=1.0.20",
    "tiktoken>=0.7,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.38",
    "pandas>=2.2",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
