<section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <!-- Photo: unsplash.com/photos/gGZ8ZynljWk — outdoor activity, sets the -->
  <!-- "movement / real life" story for this log mode. -->
  <div class="relative h-28 w-full">
    <img
      src="https://images.unsplash.com/photo-1513378628213-b8f36d8c2878?auto=format&fit=crop&w=1200&q=80"
      alt=""
      class="h-full w-full object-cover"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
    <p class="absolute bottom-3 left-5 text-sm font-medium text-white">Record an activity</p>
  </div>

  <div class="p-5">
    <p class="text-sm text-slate-500">Workouts, step counts, sleep, or travel plans — feeds the Activity/Calendar connectors.</p>

    <div class="mt-4">
      <label class="block text-xs font-medium text-slate-500">Type</label>
      <div class="mt-2 grid grid-cols-4 gap-2">
        @for (t of types; track t) {
          <button
            type="button"
            (click)="selectType(t)"
            [class]="type() === t ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-200 text-slate-500 hover:border-teal-300'"
            class="flex flex-col items-center gap-1.5 rounded-lg border px-2 py-3 text-xs font-medium transition"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
              <path [attr.d]="iconPaths[t]" />
            </svg>
            {{ t }}
          </button>
        }
      </div>
    </div>

    <div class="mt-4 grid gap-4 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-medium text-slate-500">When</label>
        <input
          type="datetime-local"
          [value]="occurredAt()"
          (input)="occurredAt.set($any($event.target).value)"
          class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
        />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500">Details</label>
        <input
          type="text"
          [value]="amount()"
          (input)="amount.set($any($event.target).value)"
          [placeholder]="amountPlaceholder[type()]"
          class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
        />
      </div>
    </div>

    <div class="mt-4">
      <label class="block text-xs font-medium text-slate-500">Notes (optional)</label>
      <textarea
        rows="2"
        [value]="notes()"
        (input)="notes.set($any($event.target).value)"
        placeholder="Anything else worth noting"
        class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
      ></textarea>
    </div>

    <button
      type="button"
      [disabled]="!amount().trim()"
      (click)="addActivity()"
      class="mt-4 h-10 rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white shadow transition hover:bg-teal-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Add to today's queue
    </button>
  </div>
</section>
