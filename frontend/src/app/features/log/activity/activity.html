<section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Record an activity</h2>
  <p class="mt-1 text-sm text-slate-500">Workouts, step counts, sleep, or travel plans — feeds the Activity/Calendar connectors.</p>

  <div class="mt-4 grid gap-4 sm:grid-cols-2">
    <div>
      <label class="block text-xs font-medium text-slate-500">Type</label>
      <select
        [value]="type()"
        (change)="type.set($any($event.target).value)"
        class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
      >
        @for (t of types; track t) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500">When</label>
      <input
        type="datetime-local"
        [value]="occurredAt()"
        (input)="occurredAt.set($any($event.target).value)"
        class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
      />
    </div>
  </div>

  <div class="mt-4">
    <label class="block text-xs font-medium text-slate-500">Details</label>
    <input
      type="text"
      [value]="amount()"
      (input)="amount.set($any($event.target).value)"
      [placeholder]="amountPlaceholder[type()]"
      class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
    />
  </div>

  <div class="mt-4">
    <label class="block text-xs font-medium text-slate-500">Notes (optional)</label>
    <textarea
      rows="2"
      [value]="notes()"
      (input)="notes.set($any($event.target).value)"
      placeholder="Anything else worth noting"
      class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
    ></textarea>
  </div>

  <button
    type="button"
    [disabled]="!amount().trim()"
    (click)="addActivity()"
    class="mt-4 h-10 rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white shadow transition hover:bg-teal-700 disabled:cursor-not-allowed disabled:opacity-50"
  >
    Add to today's queue
  </button>
</section>
