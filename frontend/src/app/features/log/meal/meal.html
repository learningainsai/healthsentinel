<section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Log a meal</h2>
  <p class="mt-1 text-sm text-slate-500">Attach a photo, describe what you ate, or both.</p>

  <div class="mt-4">
    <label class="block text-xs font-medium text-slate-500">Photo</label>
    @if (photoPreviewUrl(); as url) {
      <div class="mt-2 flex items-center gap-3">
        <img [src]="url" alt="Meal photo preview" class="h-20 w-20 rounded-lg object-cover shadow-sm" />
        <div class="text-sm text-slate-600">
          <p class="font-medium">{{ photoFile()?.name }}</p>
          <button type="button" (click)="removePhoto()" class="mt-1 text-xs text-red-600 hover:underline">
            Remove photo
          </button>
        </div>
      </div>
    } @else {
      <input
        type="file"
        accept="image/*"
        capture="environment"
        (change)="onPhotoSelected($event)"
        class="mt-2 block text-sm text-slate-600 file:mr-3 file:rounded-lg file:border-0 file:bg-teal-600 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-teal-700"
      />
      <p class="mt-1 text-xs text-slate-400">On a phone this opens the camera directly; on desktop it opens a file picker.</p>
    }
  </div>

  <div class="mt-4">
    <label class="block text-xs font-medium text-slate-500">Description</label>
    <div class="mt-2 flex flex-col gap-3 sm:flex-row">
      <input
        type="text"
        [value]="mealText()"
        (input)="mealText.set($any($event.target).value)"
        placeholder="e.g. Grilled chicken, rice, and steamed broccoli"
        class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500"
      />
      <button
        type="button"
        [disabled]="!mealText().trim() && !photoFile()"
        (click)="addMeal()"
        class="h-10 shrink-0 rounded-lg bg-teal-600 px-4 text-sm font-semibold text-white shadow transition hover:bg-teal-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        Add to today's queue
      </button>
    </div>
  </div>
</section>
