<section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500">Upload a lab report</h2>
  <p class="mt-1 text-sm text-slate-500">Extracts readings for glucose, lipids, and more — validated against a metric allowlist.</p>
  <label
    class="mt-4 flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 px-6 py-10 text-center transition hover:border-teal-400 hover:bg-teal-50/50"
  >
    <span class="text-2xl">🧪</span>
    <span class="text-sm font-medium text-slate-700">Drop a file here, or click to browse</span>
    <span class="text-xs text-slate-400">PDF, PNG, JPG, or TXT</span>
    <input type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" (change)="onFileSelected($event)" class="hidden" />
  </label>
</section>
