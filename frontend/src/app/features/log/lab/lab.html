<section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
  <!-- Photo: unsplash.com/photos/0jE8ynV4mis — real lab tubes to evoke "we -->
  <!-- extract your readings" before the dropzone has anything in it. -->
  <div class="relative h-28 w-full">
    <img
      src="https://images.unsplash.com/photo-1606206591513-adbfbdd7a177?auto=format&fit=crop&w=1200&q=80"
      alt=""
      class="h-full w-full object-cover"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
    <p class="absolute bottom-3 left-5 text-sm font-medium text-white">Upload a lab report</p>
  </div>

  <div class="p-5">
    <p class="text-sm text-slate-500">Extracts readings for glucose, lipids, and more — validated against a metric allowlist.</p>
    <label
      class="mt-4 flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 px-6 py-10 text-center transition hover:border-teal-400 hover:bg-teal-50/50"
    >
      <span class="text-2xl">🧪</span>
      <span class="text-sm font-medium text-slate-700">Drop a file here, or click to browse</span>
      <span class="text-xs text-slate-400">PDF, PNG, JPG, or TXT</span>
      <input type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" (change)="onFileSelected($event)" class="hidden" />
    </label>
  </div>
</section>
