<!-- Desktop / tablet: horizontal tab strip under the header -->
<nav class="hidden border-b border-slate-200 bg-white sm:block">
  <div class="mx-auto flex max-w-6xl gap-1 px-6">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="border-teal-600 text-teal-700"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-1.5 border-b-2 border-transparent px-3 py-3 text-sm font-medium text-slate-500 transition hover:text-teal-700"
      >
        <span aria-hidden="true">{{ tab.icon }}</span>
        {{ tab.label }}
      </a>
    }
  </div>
</nav>

<!-- Mobile: fixed bottom tab bar -->
<nav class="fixed inset-x-0 bottom-0 z-10 flex border-t border-slate-200 bg-white/95 backdrop-blur sm:hidden">
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      routerLinkActive="text-teal-700"
      [routerLinkActiveOptions]="{ exact: false }"
      class="flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-slate-500"
    >
      <span class="text-base" aria-hidden="true">{{ tab.icon }}</span>
      {{ tab.label }}
    </a>
  }
</nav>
