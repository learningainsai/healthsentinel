<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <div class="flex items-center gap-2">
      <span class="text-xl">⚕️</span>
      <span class="text-lg font-semibold tracking-tight text-slate-900">Health Sentinel</span>
    </div>
    @if (account(); as acc) {
      <div class="flex items-center gap-4">
        <div class="text-right leading-tight">
          <div class="text-sm font-medium text-slate-900">{{ acc.displayName }}</div>
          <div class="text-xs text-slate-500">{{ acc.summary }}</div>
        </div>
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-teal-600 text-sm font-semibold text-white">
          {{ acc.displayName.charAt(0) }}
        </div>
        <button
          type="button"
          (click)="logout()"
          class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
        >
          Log out
        </button>
      </div>
    }
  </div>
</header>
